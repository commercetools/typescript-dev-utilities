name: Qa

on:
  push:
    branches:
      - 'main'
      - '!changeset-release/**'
  pull_request:

# Every run shares a single commercetools project, and the integration
# suites seed and clear fixtures in it. Without this, two overlapping runs
# clobber each other: one run's cleanup wipes the fixtures another is
# asserting on, producing failures like "Expected: >= 1, Received: 0".
# A constant group (no ref) serialises across all branches and PRs, since
# the project -- not the branch -- is the contended resource.
# Queue rather than cancel: a run killed mid-suite skips teardown and
# leaks fixtures into the shared project.
concurrency:
  group: qa-integration
  cancel-in-progress: false

jobs:
  immutable-install:
    if: ${{ !startsWith(github.ref, 'refs/heads/changeset-release/') }}
    name: Immutable Install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup
        uses: ./.github/actions/ci

      # The shared install action does not respect the
      # `--immutable` flag, so we need to run it here.
      - name: Install with lockfile
        run: yarn install --immutable

  linting:
    if: ${{ !startsWith(github.ref, 'refs/heads/changeset-release/') }}
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup
        uses: ./.github/actions/ci

      - name: Lint
        run: yarn lint

  type-checking:
    if: ${{ !startsWith(github.ref, 'refs/heads/changeset-release/') }}
    name: Type checking
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup
        uses: ./.github/actions/ci

      - name: TypeScript
        run:  yarn typecheck

  testing:
    if: ${{ !startsWith(github.ref, 'refs/heads/changeset-release/') }}
    name: Testing
    needs: [immutable-install, linting, type-checking]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup
        uses: ./.github/actions/ci

      - name: Build
        run: yarn build

      - name: Link cli binaries
        run: yarn link

      - name: Ingect secrets
        uses: oNaiPs/secrets-to-env-action@ec46a22bfc9b37e014b627b3208b07eb8909ea0f # v1.5
        with:
          secrets: ${{ toJSON(secrets) }}

      - name: Test (with coverage)
        run: yarn test:pkg --coverage

  regression-testing:
    # Only run on PRs except `changeset` related PRs
    if: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/changeset-release/')) }}
    name: Regression Testing
    needs: [testing]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [18, 20]
      fail-fast: true
      max-parallel: 1

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup
        uses: ./.github/actions/ci

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.version }}

      - name: Build
        run: yarn build

      - name: Link cli binaries
        run: yarn link

      - name: Ingect secrets
        uses: oNaiPs/secrets-to-env-action@ec46a22bfc9b37e014b627b3208b07eb8909ea0f # v1.5
        with:
          secrets: ${{ toJSON(secrets) }}

      - name: Integration tests
        run: yarn test:pkg --coverage
